name: Flutter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format lib test && git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web/
          retention-days: 7
