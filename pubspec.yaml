name: telugu_padakeli
description: "An offline Telugu word-game and learning app for all ages."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/artwork/home/
    - assets/data/
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-LICENSE.txt
  fonts:
    - family: TeluguPremium
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
