name: telugu_padakeli
description: "An offline Telugu word-game and learning app for all ages."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/artwork/branding/app-icon.png
  adaptive_icon_background: "#20A5F5"
  adaptive_icon_foreground: assets/artwork/branding/app-icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/artwork/branding/app-icon.png
    background_color: "#F5FAFF"
    theme_color: "#873AF2"

flutter:
  uses-material-design: true
  assets:
    - assets/artwork/home/
    - assets/artwork/kids/
    - assets/artwork/opening/
    - assets/data/
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-LICENSE.txt
  fonts:
    - family: TeluguPremium
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
